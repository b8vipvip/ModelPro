name: Finalize v0.1.43 response stream patch

on:
  push:
    branches:
      - fix/v0.1.43-aborted-response-stream
    paths:
      - .github/workflows/apply-v0.1.43-response-stream.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Synchronize v0.1.43 and remove one-shot workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path('extension/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') != '0.1.43':
              raise SystemExit(f"unexpected manifest version: {manifest.get('version')}")

          background_path = Path('extension/background.js')
          background = background_path.read_text()
          old = "const RUNTIME_CODE_VERSION = '0.1.42';"
          new = "const RUNTIME_CODE_VERSION = '0.1.43';"
          if old in background:
              background = background.replace(old, new, 1)
          elif new not in background:
              raise SystemExit('RUNTIME_CODE_VERSION marker missing')
          background_path.write_text(background)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.1.43'
          package_path.write_text(json.dumps(package, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
          rm .github/workflows/apply-v0.1.43-response-stream.yml
      - name: Commit final synchronized patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/background.js extension/manifest.json package.json .github/workflows/apply-v0.1.43-response-stream.yml
          git commit -m "chore: finalize ModelPro v0.1.43 version sync"
          git push origin "HEAD:${GITHUB_REF_NAME}"
