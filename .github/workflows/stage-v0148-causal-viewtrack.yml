name: Stage v0.1.48 causal ViewTrack patch

on:
  push:
    branches:
      - fix/v0.1.48-causal-viewtrack-rows

permissions:
  contents: write

concurrency:
  group: modelpro-v0148-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply idempotent causal-row patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'extension/content.js';
          let text = fs.readFileSync(path, 'utf8');

          function replaceOnce(oldText, newText, marker) {
            if (text.includes(newText)) return;
            const at = text.indexOf(oldText);
            if (at < 0) throw new Error(`Patch marker not found: ${marker}`);
            if (text.indexOf(oldText, at + oldText.length) >= 0) throw new Error(`Patch marker is not unique: ${marker}`);
            text = text.slice(0, at) + newText + text.slice(at + oldText.length);
          }

          replaceOnce(
            `function defaultChatDirectModelRows(picker) {\n    if (!picker || !visible(picker)) return [];`,
            `function defaultChatDirectModelRows(picker, { requireInteraction = true } = {}) {\n    if (!picker || !visible(picker)) return [];`,
            'default-chat-helper-signature',
          );

          replaceOnce(
            `    const rows = distinctModelRows(picker).filter(interactionVisible);\n    const models = new Set(rows.map((row) => rowModelDescriptor(row).model).filter(Boolean));`,
            `    const semanticRows = distinctModelRows(picker);\n    const rows = requireInteraction ? semanticRows.filter(interactionVisible) : semanticRows;\n    const models = new Set(rows.map((row) => rowModelDescriptor(row).model).filter(Boolean));`,
            'default-chat-helper-interaction-filter',
          );

          replaceOnce(
            `        redesignedDirectRows = await waitUntil(() => {\n          const rows = defaultChatDirectModelRows(picker);\n          return rows.length === 2 ? rows : null;\n        }, 2600, 80) || [];`,
            `        redesignedDirectRows = await waitUntil(() => {\n          // The exact accessible Select-model ViewToggle just established causal ownership.\n          // ViewTrack can keep the newly selected model panel underneath a transient overlay,\n          // so the final semantic rows may temporarily fail elementFromPoint() even though\n          // they are the exact default Chat pair in this same owned picker. Final selection\n          // already uses the semantic DOM row and request/response metadata is terminal proof.\n          const rows = defaultChatDirectModelRows(picker, { requireInteraction: false });\n          return rows.length === 2 ? rows : null;\n        }, 2600, 80) || [];`,
            'post-navigation-causal-row-reacquisition',
          );

          replaceOnce(
            `    if (modern.pickerMode !== 'B' && current?.model && !models.some((item) => item.model === current.model)) {\n      models.push({ rawId: current.model, model: current.model, label: current.modelLabel || current.model });\n    }`,
            `    // A unified picker transaction that found zero semantic rows must not turn\n    // the composer summary (for example \"5.5 高\") into a fabricated catalog entry.\n    // The current-page model can supplement legacy/no-picker discovery or a successful\n    // semantic picker result, but it cannot replace a failed owned-picker discovery.\n    const currentCanJoinCatalog = !modern.picker || modern.rows.length > 0;\n    if (modern.pickerMode !== 'B' && currentCanJoinCatalog && current?.model && !models.some((item) => item.model === current.model)) {\n      models.push({ rawId: current.model, model: current.model, label: current.modelLabel || current.model });\n    }`,
            'no-fabricated-current-model-catalog-row',
          );

          fs.writeFileSync(path, text);
          NODE
      - name: Commit staged source patch
        shell: bash
        run: |
          if git diff --quiet -- extension/content.js; then
            echo "Source patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/content.js
          git commit -m "fix: reacquire causal ViewTrack model rows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
