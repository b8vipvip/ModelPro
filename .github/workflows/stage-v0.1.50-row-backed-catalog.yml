name: Stage v0.1.50 row-backed catalog fix

on:
  push:
    branches:
      - fix/v0.1.50-row-backed-catalog

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fail-closed catalog discovery fix
        shell: python
        run: |
          from pathlib import Path

          content_path = Path('extension/content.js')
          text = content_path.read_text(encoding='utf-8')
          old = "const currentCanJoinCatalog = !modern.picker || modern.rows.length > 0;"
          new = "const currentCanJoinCatalog = candidateCount > 0;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old currentCanJoinCatalog expression, found {text.count(old)}')
          text = text.replace(old, new)
          old_comment = "The current-page model can supplement legacy/no-picker discovery or a successful\n    // semantic picker result, but it cannot replace a failed owned-picker discovery."
          new_comment = "The current-page model can supplement only a successful row-backed discovery.\n    // Without at least one owned semantic model row there is no selectable account catalog,\n    // so it cannot replace either an absent trigger or a failed picker transaction."
          if old_comment not in text:
              raise SystemExit('expected catalog fallback comment was not found')
          text = text.replace(old_comment, new_comment)
          content_path.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          if '"version":"0.1.49"' not in package:
              raise SystemExit('package.json is not at v0.1.49')
          package_path.write_text(package.replace('"version":"0.1.49"', '"version":"0.1.50"', 1), encoding='utf-8')

          manifest_path = Path('extension/manifest.json')
          manifest = manifest_path.read_text(encoding='utf-8')
          if '"version": "0.1.49"' not in manifest:
              raise SystemExit('manifest is not at v0.1.49')
          manifest_path.write_text(manifest.replace('"version": "0.1.49"', '"version": "0.1.50"', 1), encoding='utf-8')

          background_path = Path('extension/background.js')
          background = background_path.read_text(encoding='utf-8')
          if "const RUNTIME_CODE_VERSION = '0.1.49';" not in background:
              raise SystemExit('background runtime is not at v0.1.49')
          background_path.write_text(background.replace("const RUNTIME_CODE_VERSION = '0.1.49';", "const RUNTIME_CODE_VERSION = '0.1.50';", 1), encoding='utf-8')

          test_path = Path('test/v0.1.50-row-backed-catalog-fallback.test.mjs')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const content = fs.readFileSync(new URL('../extension/content.js', import.meta.url), 'utf8');
          const manifest = JSON.parse(fs.readFileSync(new URL('../extension/manifest.json', import.meta.url), 'utf8'));
          const pkg = JSON.parse(fs.readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          const background = fs.readFileSync(new URL('../extension/background.js', import.meta.url), 'utf8');

          test('account catalog fallback requires at least one discovered semantic model row', () => {
            assert.match(content, /const currentCanJoinCatalog = candidateCount > 0;/);
            assert.doesNotMatch(content, /const currentCanJoinCatalog = !modern\\.picker \\|\\| modern\\.rows\\.length > 0;/);
            assert.match(content, /Without at least one owned semantic model row there is no selectable account catalog/);
          });

          test('row-backed fallback still supplements a successful picker discovery', () => {
            assert.match(content, /candidateCount = modern\\.rows\\.length;[\\s\\S]*for \\(const row of modern\\.rows\\) rememberRow\\(row\\);/);
            assert.match(content, /candidateCount = rows\\.length;[\\s\\S]*for \\(const row of rows\\)/);
            assert.match(content, /currentCanJoinCatalog && current\\?\\.model/);
          });

          test('v0.1.50 runtime surfaces stay synchronized', () => {
            assert.equal(manifest.version, '0.1.50');
            assert.equal(pkg.version, manifest.version);
            assert.match(background, /const RUNTIME_CODE_VERSION = '0\\.1\\.50';/);
          });
          """.replace(/^          /gm, ''), encoding='utf-8')
      - name: Test staged ModelPro
        run: npm test
      - name: Commit staged release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-v0.1.50-row-backed-catalog.yml
          git add extension/content.js extension/background.js extension/manifest.json package.json test/v0.1.50-row-backed-catalog-fallback.test.mjs
          git commit -m "v0.1.50: require row-backed catalog discovery [stage-done]"
          git push origin HEAD:fix/v0.1.50-row-backed-catalog
