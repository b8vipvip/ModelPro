name: Stage ModelPro v0.1.49 response-conflict retry

on:
  push:
    branches:
      - fix/v0.1.49-response-conflict-retry

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch ModelPro v0.1.49
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('extension/model-verification.js')
          text = p.read_text(encoding='utf-8')
          old = """export function shouldRetryTransientResponse(result = {}, { maxRetries = 1 } = {}) {
            const retryCount = Math.max(0, Number(result.retryCount || 0));
            const httpStatus = Number(result.responseHttpStatus || 0);
            const bodyError = String(result.responseBodyError || result.error || '');
            return result.requestConfirmed === true
              && result.responseConfirmed !== true
              && retryCount < Math.max(0, Number(maxRetries || 0))
              && httpStatus === 200
              && /(?:net::ERR_ABORTED|network_loading_failed)/i.test(bodyError)
              && (!result.responseModel || result.responseIssue === 'response_body_read_failed');
          }
"""
          new = """export function shouldRetryTransientResponse(result = {}, { maxRetries = 1 } = {}) {
            const retryCount = Math.max(0, Number(result.retryCount || 0));
            const httpStatus = Number(result.responseHttpStatus || 0);
            const bodyError = String(result.responseBodyError || result.error || '');
            const responseIssue = String(result.responseIssue || '');
            const commonRetryGate = result.requestConfirmed === true
              && result.responseConfirmed !== true
              && retryCount < Math.max(0, Number(maxRetries || 0))
              && httpStatus === 200;
            if (!commonRetryGate) return false;

            // A model-bearing 200 response can transiently expose mutually inconsistent
            // routing/default metadata while the backend handoff settles. The consumer
            // must not accept either candidate, but one bounded replay is safer than
            // turning the entire account verification partial when the next identical
            // request produces one unambiguous served-model identity.
            if (responseIssue === 'response_metadata_conflict' && !result.responseModel) return true;

            return /(?:net::ERR_ABORTED|network_loading_failed)/i.test(bodyError)
              && (!result.responseModel || responseIssue === 'response_body_read_failed');
          }
"""
          text = replace_once(text, old, new, 'retry policy')
          p.write_text(text, encoding='utf-8')

          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('version') != '0.1.48':
              raise SystemExit(f'package version drift: {data.get("version")}')
          data['version'] = '0.1.49'
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          p = Path('extension/manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('version') != '0.1.48':
              raise SystemExit(f'manifest version drift: {data.get("version")}')
          data['version'] = '0.1.49'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('extension/background.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text, "const RUNTIME_CODE_VERSION = '0.1.48';", "const RUNTIME_CODE_VERSION = '0.1.49';", 'runtime version')
          p.write_text(text, encoding='utf-8')

          Path('test/v0.1.49-response-conflict-retry.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { shouldRetryTransientResponse } from '../extension/model-verification.js';

          test('retries one HTTP 200 served-model metadata conflict after request authority is confirmed', () => {
            assert.equal(shouldRetryTransientResponse({
              requestConfirmed: true,
              responseConfirmed: false,
              responseHttpStatus: 200,
              responseIssue: 'response_metadata_conflict',
              responseModel: null,
              retryCount: 0,
            }, { maxRetries: 1 }), true);
          });

          test('metadata-conflict retry remains bounded and requires a confirmed request', () => {
            const base = {
              requestConfirmed: true,
              responseConfirmed: false,
              responseHttpStatus: 200,
              responseIssue: 'response_metadata_conflict',
              responseModel: null,
            };
            assert.equal(shouldRetryTransientResponse({ ...base, retryCount: 1 }, { maxRetries: 1 }), false);
            assert.equal(shouldRetryTransientResponse({ ...base, requestConfirmed: false, retryCount: 0 }, { maxRetries: 1 }), false);
            assert.equal(shouldRetryTransientResponse({ ...base, responseHttpStatus: 500, retryCount: 0 }, { maxRetries: 1 }), false);
          });

          test('keeps the existing no-body aborted response retry contract', () => {
            assert.equal(shouldRetryTransientResponse({
              requestConfirmed: true,
              responseConfirmed: false,
              responseHttpStatus: 200,
              responseBodyError: 'net::ERR_ABORTED',
              responseIssue: 'response_body_read_failed',
              responseModel: null,
              retryCount: 0,
            }, { maxRetries: 1 }), true);
          });
          ''', encoding='utf-8')

          Path('.github/workflows/stage-v0.1.49-response-conflict-retry.yml').unlink()

      - name: Test
        run: npm test

      - name: Commit staged patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.1.49: retry transient response metadata conflicts [stage-done]"
          git push
